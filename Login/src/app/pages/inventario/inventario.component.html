<section class="page">
  <app-user-menu></app-user-menu>
  <header>
    <div>
      <h1>Inventario</h1>
      <p>Listado de equipos biomédicos.</p>
    </div>
    <div class="header-actions">
      <a class="back" routerLink="/dashboard">Menú</a>
    </div>
  </header>

  <app-module-tabs></app-module-tabs>

  <div class="card filters-card">
    <div class="filters-top" *ngIf="clients.length">
      <div class="filters">
        <label>
          Buscar cliente
          <input type="text" [(ngModel)]="clientSearchTerm" placeholder="Escribe para filtrar..." />
        </label>
        <label>
          Cliente
          <select [(ngModel)]="selectedClientId" (change)="loadItems()">
            <option *ngFor="let client of filteredClients" [value]="client.id">{{ client.name }}</option>
          </select>
        </label>
      </div>
      <div class="client-preview" *ngIf="selectedClientInfo">
        <div class="client-preview-info">
          <div><strong>{{ selectedClientInfo.name }}</strong></div>
          <div *ngIf="selectedClientInfo.nit">NIT: {{ selectedClientInfo.nit }}</div>
          <div *ngIf="selectedClientInfo.city">Ciudad: {{ selectedClientInfo.city }}</div>
          <div *ngIf="selectedClientInfo.address">Dirección: {{ selectedClientInfo.address }}</div>
          <div *ngIf="selectedClientInfo.email">Correo: {{ selectedClientInfo.email }}</div>
        </div>
        <img *ngIf="clientLogoUrl(selectedClientInfo)" [src]="clientLogoUrl(selectedClientInfo)!" alt="Logo cliente" />
      </div>
    </div>
  </div>

  <app-inventory-panel
    [items]="items"
    [selectedClientId]="selectedClientId"
    [loading]="loading"
    [errorMessage]="errorMessage"
    [canEdit]="auth.hasPermission('hb:create')"
    [canMove]="auth.hasPermission('inventory:move')"
    [canUploadHistory]="auth.hasPermission('asset_history:upload')"
    title="Inventario"
    (editItem)="goEdit($event)"
    (deleteItem)="deleteItem($event)"
    (movedItem)="loadItems()"
  ></app-inventory-panel>
</section>
