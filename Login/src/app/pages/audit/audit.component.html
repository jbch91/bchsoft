<section class="page">
  <app-user-menu></app-user-menu>
  <header>
    <div>
      <h1>Auditoría</h1>
      <p>Registro de cambios (solo superuser).</p>
    </div>
    <div class="header-actions">
      <a class="back" routerLink="/dashboard">Menú</a>
    </div>
  </header>

  <app-module-tabs></app-module-tabs>

  <div class="filters">
    <label>
      Actor
      <select [(ngModel)]="selectedActor" (change)="applyFilters()">
        <option *ngFor="let actor of actors" [value]="actor">{{ actor }}</option>
      </select>
    </label>

    <label>
      Acción
      <select [(ngModel)]="selectedAction" (change)="applyFilters()">
        <option *ngFor="let action of actions" [value]="action">
          {{ action === 'todos' ? 'Todos' : labelAction(action) }}
        </option>
      </select>
    </label>

    <label>
      Desde
      <input type="date" [(ngModel)]="dateFrom" (change)="applyFilters()" />
    </label>

    <label>
      Hasta
      <input type="date" [(ngModel)]="dateTo" (change)="applyFilters()" />
    </label>
  </div>

  <p *ngIf="loading">Cargando...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="empty" *ngIf="!loading && !errorMessage && filteredLogs.length === 0">
    Sin registros por ahora.
  </p>

  <div class="table" *ngIf="!loading && filteredLogs.length">
    <div class="row header">
      <span>Fecha</span>
      <span>Actor</span>
      <span>Acción</span>
      <span>Tipo</span>
      <span>Objetivo</span>
      <span>Detalles</span>
    </div>
    <div class="row" *ngFor="let log of filteredLogs">
      <span data-label="Fecha">{{ log.when }}</span>
      <span data-label="Actor">{{ log.actor }}</span>
      <span data-label="Acción"><strong class="action-pill">{{ log.action }}</strong></span>
      <span data-label="Tipo">{{ log.category }}</span>
      <span data-label="Objetivo">{{ log.target }}</span>
      <span data-label="Detalles" class="details-text">{{ log.details }}</span>
    </div>
  </div>
</section>
