<section class="login">
  <div class="title">INBIHOSPITALARIO</div>
  <div class="card">
    <div class="brand">
      <img src="/assets/inbi-logo.png" alt="INBIHOSPITALARIO" />
    </div>
    <h1>LOGIN</h1>

    <div class="alert session" *ngIf="sessionMessage" aria-live="polite">{{ sessionMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <label>
        Usuario
        <input type="text" name="username" [(ngModel)]="username" autocomplete="username" required />
      </label>

      <label>
        Contraseña
        <span class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-visibility"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
            (click)="togglePasswordVisibility()"
          >
            <span
              class="password-eye-icon"
              [class.is-hidden]="showPassword"
              aria-hidden="true"
            ></span>
          </button>
        </span>
      </label>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Validando...' : 'Entrar' }}
      </button>
    </form>

    <div class="alert" *ngIf="errorMessage" aria-live="polite">{{ errorMessage }}</div>

    <button type="button" class="link" (click)="openRecovery()">
      ¿Olvidaste tu contraseña?
    </button>
  </div>

  <div class="modal-backdrop" *ngIf="showRecovery" (click)="closeRecovery()">
    <section
      class="recovery-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="recovery-title"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closeRecovery()"
      tabindex="-1"
    >
      <header class="modal-header">
        <div>
          <span>Acceso seguro</span>
          <h2 id="recovery-title">Recuperar contraseña</h2>
        </div>
        <button type="button" class="icon-button" aria-label="Cerrar recuperación" (click)="closeRecovery()">
          ×
        </button>
      </header>

      <p class="modal-copy">
        Ingresa tu correo, solicita el código y define una nueva contraseña para recuperar el acceso.
      </p>

      <div
        class="modal-alert"
        *ngIf="recoveryMessage"
        [class.success]="recoveryMessageType === 'success'"
        [class.error]="recoveryMessageType === 'error'"
        aria-live="polite"
      >
        {{ recoveryMessage }}
      </div>

      <div class="recovery-grid">
        <label>
          Correo
          <input
            type="email"
            name="recoveryEmail"
            [(ngModel)]="recoveryEmail"
            autocomplete="email"
            [ngModelOptions]="{ standalone: true }"
          />
        </label>

        <button
          type="button"
          class="secondary-action"
          (click)="onRequestCode()"
          [disabled]="isSendingRecoveryCode || isResettingPassword"
        >
          {{ isSendingRecoveryCode ? 'Enviando...' : 'Enviar código' }}
        </button>
      </div>

      <div class="divider"></div>

      <div class="recovery-grid">
        <label>
          Código
          <input
            type="text"
            name="recoveryCode"
            [(ngModel)]="recoveryCode"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            [ngModelOptions]="{ standalone: true }"
          />
        </label>

        <label>
          Nueva contraseña
          <span class="password-input">
            <input
              [type]="showRecoveryPassword ? 'text' : 'password'"
              name="recoveryPassword"
              [(ngModel)]="recoveryPassword"
              minlength="10"
              autocomplete="new-password"
              [ngModelOptions]="{ standalone: true }"
            />
            <button
              type="button"
              class="password-visibility"
              [attr.aria-label]="showRecoveryPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.title]="showRecoveryPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="showRecoveryPassword"
              (click)="toggleRecoveryPasswordVisibility()"
            >
              <span
                class="password-eye-icon"
                [class.is-hidden]="showRecoveryPassword"
                aria-hidden="true"
              ></span>
            </button>
          </span>
        </label>
      </div>

      <div class="password-hint">
        Mínimo 10 caracteres, una mayúscula, una minúscula y un número.
      </div>

      <footer class="modal-actions">
        <button type="button" class="ghost-action" (click)="closeRecovery()">Cancelar</button>
        <button
          type="button"
          (click)="onResetPassword()"
          [disabled]="isSendingRecoveryCode || isResettingPassword"
        >
          {{ isResettingPassword ? 'Cambiando...' : 'Cambiar contraseña' }}
        </button>
      </footer>
    </section>
  </div>
</section>
