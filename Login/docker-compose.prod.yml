services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bchsoft
      POSTGRES_USER: bchsoft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bchsoft}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bchsoft -d bchsoft"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bchsoft
      DB_USER: bchsoft
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bchsoft}
      NODE_ENV: production
      # In production we serve the SPA and API from the same origin; CORS becomes a no-op.
      CORS_ORIGIN: "*"
      PORT: "5050"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pg_data:
  uploads:

