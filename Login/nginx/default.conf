server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  # API (backend) is mounted at /api to avoid clashing with SPA routes.
  location /api/ {
    proxy_pass http://api:5050/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Public files (logos, PDFs, signatures, etc.)
  location /uploads/ {
    proxy_pass http://api:5050/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
  }

  # Hashed Angular bundles are safe to cache aggressively because every build changes the filename.
  location ~* ^/(main|chunk|styles)-[A-Za-z0-9]+\.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # PDF.js is distributed as ES modules. Nginx does not map .mjs in every image,
  # and browsers reject module scripts served as application/octet-stream.
  location ~* \.mjs$ {
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
  }

  # Brand/favicon assets can change without a content hash, so keep the cache short.
  location ~* ^/assets/.*\.(png|jpg|jpeg|webp|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /index.html {
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
}
